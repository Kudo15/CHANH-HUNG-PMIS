name: Local foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pmis_test
          POSTGRES_USER: pmis_test
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U pmis_test -d pmis_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pmis_test:synthetic_ci_only@127.0.0.1:5432/pmis_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m alembic upgrade head --sql
      - name: Validate local Compose configuration
        working-directory: .
        env:
          POSTGRES_PASSWORD: synthetic_ci_only
          DATABASE_URL: postgresql+psycopg://pmis_dev:synthetic_ci_only@db:5432/pmis_dev
          KC_BOOTSTRAP_ADMIN_PASSWORD: synthetic_ci_only
          OIDC_CLIENT_SECRET: synthetic_ci_only
          KC_SYNTHETIC_ADMIN1_PASSWORD: synthetic_ci_only
          KC_SYNTHETIC_ADMIN2_PASSWORD: synthetic_ci_only
        run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
